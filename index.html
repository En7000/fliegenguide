/* V4 Release design polish */
:root{--ink:#123b43;--navy:#0b303a;--teal:#0c757d;--sea:#e5f3ef;--edge:#d6e7e3;--gold:#dfaf71}
body{background:linear-gradient(180deg,#f2f6f2 0%,#ebf3ef 44%,#eef3f0 100%)}
.navbar{box-shadow:0 8px 35px #16485012}.panel{box-shadow:0 7px 28px rgba(9,51,62,.045);border-color:#dce8e3}
.fish-chip.sel,.rank-choice.chosen{box-shadow:inset 0 0 0 1px #1c8188}
button,select,input{touch-action:manipulation}
@media(max-width:700px){.bottom-rail{padding-bottom:calc(7px + env(safe-area-inset-bottom))}.wrap{padding-bottom:calc(95px + env(safe-area-inset-bottom))}.scene canvas{display:block;width:100%;height:auto}}

.original-media{border-radius:17px;overflow:hidden;border:1px solid var(--edge);background:#e3eeec;margin:13px 0}

.media-note{padding:12px 15px;color:var(--muted);background:#f3f8f5;font-size:13px;line-height:1.5}
.original-link{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 15px;background:#176575;color:#fff;font-weight:700;text-decoration:none;margin:7px 8px 7px 0}
.original-link:hover{background:#104852;color:white}
.fish-iframe{display:block;border:0;background:#edf3f0;width:100%;height:1300px;min-height:740px;border-radius:15px}

@media(max-width:650px){.fish-iframe{min-height:820px}.orig-frame{height:800px}.original-link{font-size:13px;padding:12px}.topbar{background-position:center}}

 if(st.target==='hecht')warning.push('Hecht: bissfestes Stahl- oder Titanvorfach vorsehen. Grosse Hechtstreamer benötigen eine passende kräftige Rute.');

function montagePage(){const f=FLY[currentFly()],rig=getRig();return `${head('Rubrik 04 · Vorbereitung','Montage & Ausrüstung','Die Werte aus «Am Wasser» und «Fliegen» werden übernommen. Nur hier wählst du Schnurklasse und bei Bedarf eine eigene Hakengrösse.')}<div class="layout"><div class="panel"><div class="section-title">Deine aktuelle Auswahl</div><div class="spec-card"><b>${f.emo} ${f.name} · ${st.water==='see'?'See':st.water==='bach'?'Bach':'Fluss'}</b><p>Wetter: ${FIELDS.weather.find(x=>x[0]===st.weather)?.[1]} · Wasser: ${FIELDS.clarity.find(x=>x[0]===st.clarity)?.[1]} · Zielart: ${SPECIES.find(x=>x.id===st.target)?.name||'Offen'}</p></div><div class="section-title">Fliegenschnur und Wurfklasse</div>${selectF('line','Fliegenschnur') }<div class="spec-card" style="margin-top:11px"><b>${LINE[st.line].name} · ${LINE[st.line].rate}</b><p>${LINE[st.line].info}</p></div><div class="grid2" style="margin-top:12px"><div class="field"><label for="c-wt">Schnurklasse / WT (optional)</label><select id="c-wt" data-key="wt">${CHOICE(Array.from({length:9},(_,i)=>[String(i+2),`#${i+2} WT`]),st.wt)}</select></div><div class="field"><label for="c-hook">Hakengrösse</label><select id="c-hook" data-key="hook">${CHOICE([['auto','Automatisch nach Fliege'],...HOOKS.map(x=>[x,'#'+x])],st.hook)}</select></div></div><p class="smallprint">Rutenlänge ist keine Pflichtangabe und verändert die Vorfachlänge nicht automatisch. Die Klasse prüft hauptsächlich, ob die Fliege sinnvoll werfbar ist.</p><div class="hline"></div><details class="optional"><summary>Sinkraten kurz erklärt</summary><div class="info-rows">${Object.values(LINE).map(x=>`<div class="info-row"><span>${x.name}</span><span>${x.rate}</span></div>`).join('')}</div><p>Bei Sinktip und Sinking existiert keine einzige allgemeingültige Rate. Eine Produktangabe wie 3 IPS entspricht 7,62 cm/s.</p></details></div><div class="panel"><div class="section-title">Automatische Montage</div><h3>${f.name} · ${LINE[st.line].name}</h3>${rigSummary(false)}<div class="hline"></div><div class="scene"><svg viewBox="0 0 720 108" width="100%" role="img" aria-label="Schnuraufbau: Fliegenschnur, Vorfach, Tippet, Fliege"><rect width="720" height="108" fill="#e9f4f2"/><path d="M22 42 H158" stroke="#d9a464" stroke-width="9" stroke-linecap="round"/><path d="M158 42 H544" stroke="#177b8b" stroke-width="6" stroke-linecap="round"/><path d="M544 42 H680" stroke="#a2b4bd" stroke-width="2.8" stroke-linecap="round"/><circle cx="544" cy="42" r="5" fill="#196773"/><g font-family="system-ui,Arial" fill="#35606a" font-size="16" text-anchor="middle"><text x="84" y="72">Fliegenschnur</text><text x="357" y="72">Vorfach</text><text x="605" y="72">Tippet</text></g></svg></div><div class="btnbar" style="margin-top:13px"><button class="btn" data-action="copyrig">Montage kopieren</button><button class="btn ghost" data-jump="fliegen">Führung ansehen</button></div><p class="caption">Längen sind begründete Ausgangswerte. Die Berechnung variiert mit Fliege, Gewässer, Schnur und Sicht – nicht mechanisch mit der Rutenlänge.</p></div></div><div class="panel" style="margin-top:14px"><h3>Montageprüfung – aktueller Original-Rechner aus Rubrik 4</h3><p>Erweiterte Prüfung mit Vorfachtyp, Hakengrössen und eigenem Material. Diese Detailansicht besitzt eigene Eingabefelder und wird noch nicht automatisch in den kompakten Rechner zurückgeschrieben.</p><details class="optional"><summary>Original-Rechner anzeigen</summary><iframe class="orig-frame" title="Rubrik 4 originaler Montage- und Hakengrössenrechner" loading="lazy" src="module/montage-original.html" onload="notifyMontageModule()"></iframe></details><a href="module/montage-original.html" target="_blank" rel="noopener" class="original-link">Montage-Fachrechner im Vollbild ↗</a></div>`}

zungen und das Festziehen sind noch keine verbindliche Bindeanleitung. Diese Rubrik bleibt unabhängig; kein Knotenlink in der Montageempfehlung.</div><div class="hline"></div><h3>3D-Clinch: aktueller experimenteller Stand</h3><p>Die aktuelle Testanimation aus Rubrik 5 ist hier als Entwicklungsprobe verfügbar. Die Schnurführung und das Anziehen sind noch nicht endgültig verifiziert; zum tatsächlichen Knotenbinden bitte eine geprüfte Anleitung verwenden.</p><div class="original-media"><video controls playsinline preload="none" src="assets/animationen/clinch-3d-experiment.mp4"></video><div class="media-note">3D-Entwicklungsvideo – nicht für eine sichere Knotenanleitung freigegeben.</div></div><a class="original-link" href="module/clinch-3d-experiment.html" target="_blank" rel="noopener">Drehbaren 3D-Prototyp öffnen ↗</a></div>`}
